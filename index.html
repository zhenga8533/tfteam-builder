<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applies the saved theme before first paint so the page doesn't flash the wrong one.
      try {
        const theme = JSON.parse(localStorage.getItem("tfteam-settings") ?? "{}").state?.theme ?? "system";
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {
        // Unreadable settings keep the default dark theme.
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/tft-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan Teamfight Tactics team comps, browse champions, traits, items and augments, and follow the comp tier list."
    />
    <meta name="theme-color" content="#14161f" />
    <!-- Link previews (Discord, Reddit, X…). Crawlers don't run the app, so these describe the site as a whole. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TFTeam" />
    <meta property="og:title" content="TFTeam" />
    <meta
      property="og:description"
      content="Comps, stats and a team builder for Teamfight Tactics: tier lists from ranked games, a drag-and-drop team builder, and tools to explore and share."
    />
    <meta property="og:url" content="https://zhenga8533.github.io/tfteam/" />
    <meta property="og:image" content="https://zhenga8533.github.io/tfteam/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TFTeam: comps, stats and a team builder for Teamfight Tactics" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://raw.communitydragon.org" />
    <title>TFTeam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
