name: Deploy

on:
  push:
    branches: [main]
  # Publish fresh match stats after each crawl.
  workflow_run:
    workflows: [Crawl]
    types: [completed]
  schedule:
    # Picks up new patches even when crawls aren't running (e.g. no API key configured).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint already ran on the PR; tests run again because they check the freshly generated game data.
      - run: npm run data
      - run: npm test
      # Reads stored boards from R2; without credentials (or boards) it skips and the site hides stats. Finished sets
      # are frozen: their Explorer files go to the public bucket's archive once, and later deploys publish the archive.
      # With nothing new (no boards, game data or stats code), it republishes the last build; a manual run always
      # rebuilds.
      - run: npm run stats -- ${{ github.event_name != 'workflow_dispatch' && '--reuse' || '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
      # Serves the Explorer's files from the public bucket instead of bundling them; without it, they stay in the site.
      - run: npm run publish-explorer
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
          EXPLORER_PUBLIC_URL: ${{ vars.EXPLORER_PUBLIC_URL }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
