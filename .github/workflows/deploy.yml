name: Deploy

on:
  push:
    branches: [main]
  # Publish fresh match stats after each crawl.
  workflow_run:
    workflows: [Crawl]
    types: [completed]
  schedule:
    # Picks up new patches even when crawls aren't running (e.g. no API key configured).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run data
      - run: npm test
      # Missing until the first crawl publishes it; the site then simply hides stats.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: stats
          path: stats
      - run: npm run stats -- --stats stats
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
