name: Crawl

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms to crawl (blank for all)
        required: false
      budget-minutes:
        description: Time budget for API requests
        required: false
        default: "45"

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    # Opt-in: set the CRAWL_ENABLED repository variable to "true" once the RIOT_API_KEY and R2_* secrets exist.
    if: vars.CRAWL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Crawler state and boards live in Cloudflare R2.
      - run: npm run crawl -- --budget-minutes "$BUDGET" ${PLATFORMS:+--platforms "$PLATFORMS"}
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BUDGET: ${{ inputs.budget-minutes || '45' }}
          PLATFORMS: ${{ inputs.platforms }}
