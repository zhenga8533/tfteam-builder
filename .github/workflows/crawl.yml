name: Crawl

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms to crawl (blank for all)
        required: false
      budget-minutes:
        description: Time budget for API requests
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    # Opt-in: set the CRAWL_ENABLED repository variable to "true" once the RIOT_API_KEY secret exists.
    if: vars.CRAWL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The stats branch doesn't exist until the first successful crawl.
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: stats
          path: stats
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run crawl -- --state stats --budget-minutes "$BUDGET" ${PLATFORMS:+--platforms "$PLATFORMS"}
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          BUDGET: ${{ inputs.budget-minutes || '45' }}
          PLATFORMS: ${{ inputs.platforms }}
      # Publish as a single orphan commit so the branch's history doesn't grow with every run.
      - name: Publish stats branch
        working-directory: stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf .git
          git init -q -b stats
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update match stats"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
